<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/styles.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md fade-in">
    <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Welcome Back</h2>
    <form action="./dashboard.html">
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">Email</label>
        <input type="email"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          placeholder="your@email.com">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-2">Password</label>
        <input type="password"
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
          placeholder="••••••••">
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition">
        Sign In
      </button>
    </form>
    <p class="text-center text-gray-600 mt-4">
      Don't have an account? <button onclick="showScreen('dashboard')"
        class="text-indigo-600 font-semibold hover:underline">Sign Up</button>
    </p>
  </div>

  <script src="../assets/ui.js" defer></script>
</body>

</html>
