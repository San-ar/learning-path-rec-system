<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Login | Career LPRS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/styles.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-indigo-600 to-purple-600 flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold text-gray-800 mb-2 text-center">Welcome Back</h2>
    <p class="text-center text-gray-500 text-sm mb-6">Enter your details to access your dashboard</p>
    
    <form id="loginForm">
      <div class="mb-4">
        <label class="block text-gray-700 font-medium mb-2">Username or Email</label>
        <input type="text" id="username" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition"
          placeholder="admin / user">
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 font-medium mb-2">Password</label>
        <input type="password" id="password" required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition"
          placeholder="••••••••">
      </div>
      
      <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-xs font-bold rounded-lg text-center">
        Invalid credentials. Please try again.
      </div>

      <button type="submit"
        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition shadow-lg shadow-indigo-200">
        Sign In
      </button>
    </form>
    
    <div class="mt-8 pt-6 border-t border-gray-100 text-center">
      <p class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-3">Prototype Credentials</p>
      <div class="flex justify-center gap-4">
        <div class="text-[10px] text-gray-500">Admin: <span class="font-mono bg-gray-100 px-1">admin</span></div>
        <div class="text-[10px] text-gray-500">User: <span class="font-mono bg-gray-100 px-1">user</span></div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Stop page from refreshing
      
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');

      // Logic for Admin
      if (user === 'admin' && pass === 'admin') {
        window.location.href = './admin/dashboard.html';
      } 
      // Logic for regular User (or any other entry)
      else if (user === 'user' || user === 'alex') {
        window.location.href = './dashboard.html';
      } 
      // Basic Error handling
      else {
        errorDiv.classList.remove('hidden');
        setTimeout(() => { errorDiv.classList.add('hidden'); }, 3000);
      }
    });
  </script>
</body>
</html>
