<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Career Matches | LPRS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    .glass-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }
  </style>
  <script type="module">
    import { pipeline, cosine_similarity } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    window.pipeline = pipeline;
    window.cosine_similarity = cosine_similarity;
</script>
</head>

<body class="bg-gray-50">

  <div id="navbar-placeholder"></div>

  <div class="container mx-auto px-6 py-12 max-w-7xl">
    <div class="mb-12 text-center">
      <h2 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-3">Your Personalized Matches</h2>
      <p class="text-gray-600 max-w-2xl mx-auto">We analyzed your background, skills, and interests. Here are the fields
        where you have the highest potential for success.</p>
    </div>

    <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <!-- Dynamic field cards will be injected here -->
    </div>


    <div class="mt-16 bg-indigo-900 rounded-3xl p-8 text-center text-white overflow-hidden relative">
      <div class="relative z-10">
        <h3 class="text-2xl font-bold mb-2">Not seeing what you expected?</h3>
        <p class="text-indigo-200 mb-6">Refine your profile or interests to see updated recommendations.</p>
        <a href="../profile/profile-step1.html"
          class="inline-block bg-white text-indigo-900 px-8 py-3 rounded-full font-bold hover:bg-indigo-50 transition">
          Edit Profile
        </a>
      </div>
      <div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-indigo-800 rounded-full opacity-50"></div>
    </div>
  </div>
  <script src="../assets/ui.js"></script>
  <script src="../assets/field-results.js"></script>
</body>

</html>
