<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Your Learning Roadmap | LPRS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/styles.css">
</head>

<body class="bg-gray-50">

  <div id="navbar-placeholder"></div>

  <div class="container mx-auto px-6 py-12 max-w-4xl">

    <div class="mb-16 text-center">
      <div
        class="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-[10px] font-bold tracking-widest uppercase mb-4">
        Recommended Sequence
      </div>
      <h2 id="role-title" class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4">Loading Path...</h2>
      <p class="text-gray-500 max-w-xl mx-auto mb-8">This roadmap is curated based on your current skill gaps.</p>

      <div class="flex flex-wrap justify-center gap-4">
        <span id="time-estimate"
          class="px-4 py-1.5 bg-white border border-gray-200 text-gray-700 rounded-full text-xs font-bold shadow-sm">Calculating...</span>
        <span id="spec-count"
          class="px-4 py-1.5 bg-white border border-gray-200 text-gray-700 rounded-full text-xs font-bold shadow-sm">0
          Specializations</span>
      </div>
    </div>

    <div class="relative">
      <div class="absolute left-6 md:left-8 top-0 bottom-0 w-0.5 bg-gray-200 -z-0"></div>

      <div id="path-container">
        <div class="text-center py-20 text-gray-400 italic">Generating your custom roadmap...</div>
      </div>

      <div class="mt-20 bg-gray-900 rounded-3xl p-10 text-center relative overflow-hidden shadow-2xl">
        <div class="relative z-10">
          <h3 class="text-3xl font-bold text-white mb-4">Ready to commit to your future?</h3>
          <p class="text-gray-400 mb-8 max-w-lg mx-auto">The sequence above is a recommendation based on industry
            prerequisites.</p>
          <div class="flex flex-col sm:flex-row justify-center gap-4">
            <a href="../dashboard.html"
              class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold hover:bg-indigo-700 transition">Save
              Roadmap</a>
            <button onclick="window.print()"
              class="bg-white text-gray-900 px-10 py-4 rounded-2xl font-bold hover:bg-gray-50 transition border border-gray-200">Download
              PDF</button>
          </div>
        </div>
        <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-indigo-500 rounded-full blur-3xl opacity-20"></div>
      </div>
    </div>
  </div>
  <script src="../assets/ui.js"></script>
  <script src="../assets/learning-path.js"></script>
  <script>
    initializeNavbar({ url: './skill-gaps.html', label: 'Skill Gaps' });
  </script>
</body>

</html>
