<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skill Gap Analysis | LPRS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/styles.css">
  <style>
    /* Smooth animation for the progress ring */
    #progress-ring-circle {
      transition: stroke-dashoffset 0.8s ease-in-out;
    }
  </style>
</head>

<body class="bg-gray-50">
  <div id="navbar-placeholder"></div>

  <div class="container mx-auto px-6 py-12 max-w-6xl">
    <div class="mb-12 text-center">
      <div class="inline-block px-4 py-1.5 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold uppercase tracking-widest mb-4">
        Deep Dive Analysis
      </div>
      <h2 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-2">Skill Gap Analysis</h2>
      <p class="text-gray-600">
        Targeting: <span id="field-name" class="font-bold text-gray-900 underline decoration-indigo-500 underline-offset-4"></span>
      </p>
    </div>

    <div class="grid lg:grid-cols-2 gap-8 items-start">
      <section class="space-y-6">
        <h3 class="text-xl font-bold text-gray-800 flex items-center px-2">
          <span class="w-8 h-8 rounded-lg bg-green-100 text-green-600 flex items-center justify-center mr-3 text-sm">✓</span>
          Your Current Strengths
        </h3>
        <div id="strength-list" class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-50 overflow-hidden">
          </div>
      </section>

      <section class="space-y-6">
        <h3 class="text-xl font-bold text-gray-800 flex items-center px-2">
          <span class="w-8 h-8 rounded-lg bg-orange-100 text-orange-600 flex items-center justify-center mr-3 text-sm">🎯</span>
          Areas to Develop
        </h3>
        <div id="gap-list" class="bg-white rounded-2xl shadow-sm border border-gray-100 divide-y divide-gray-50 overflow-hidden">
          </div>
      </section>
    </div>

    <div class="mt-16 bg-white rounded-3xl p-8 border border-gray-100 shadow-sm relative overflow-hidden">
      <div class="flex flex-col md:flex-row items-center gap-8 relative z-10">
        
        <div class="relative flex-shrink-0">
          <svg class="w-32 h-32 transform -rotate-90">
            <circle cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent" class="text-gray-100" />
            <circle id="progress-ring-circle" cx="64" cy="64" r="58" stroke="currentColor" stroke-width="8" fill="transparent"
              class="text-indigo-600" stroke-dasharray="364.4" stroke-dashoffset="364.4" stroke-linecap="round" />
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="readiness-percentage" class="text-2xl font-black text-gray-800">0%</span>
            <span class="text-[8px] font-bold text-gray-400 uppercase">Progress</span>
          </div>
        </div>

        <div class="text-center md:text-left">
          <h4 class="text-2xl font-bold text-gray-900 mb-2">Skill readiness estimation</h4>
          <p class="text-gray-600 mb-6 max-w-lg">
            Based on your profile, you are <span id="readiness-text" class="font-bold text-indigo-600">calculating...</span> ready for this role. 
            Check your recommended learning path to bridge the remaining gaps.
          </p>
          <a href="learning-path.html" class="inline-flex items-center px-8 py-4 bg-indigo-600 text-white rounded-xl font-bold text-lg hover:bg-indigo-700 transition-all hover:shadow-xl hover:-translate-y-0.5">
            View Learning Path
            <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/ui.js"></script>
  <script>
    // Note: ensure this matches your folder structure
    if(typeof initializeNavbar === 'function') {
      initializeNavbar({ url: '../results/field-results.html', label: 'Field Results' });
    }
  </script>
  <script src="../assets/skill-gaps.js"></script>
</body>
</html>
